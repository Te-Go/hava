name: Automated Hostinger Deployment

on:
  push:
    branches:
      - main # Triggers the deployment every time code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Tedder Weather Engine Plugin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: ./wp-content/plugins/tedder-weather-engine/
          server-dir: /public_html/wp-content/plugins/tedder-weather-engine/
          state-name: .ftp-plugin-sync-state.json
          dangerous-clean-slate: true

      - name: Deploy GeneratePress Child Theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: ./generatepress_child/
          server-dir: /public_html/wp-content/themes/generatepress_child/
          state-name: .ftp-theme-sync-state.json
          dangerous-clean-slate: true

      - name: Deploy Root Assets (Logos)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: ./logos/
          server-dir: /public_html/logos/
          state-name: .ftp-logos-sync-state.json
          dangerous-clean-slate: true
