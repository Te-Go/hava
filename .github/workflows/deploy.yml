name: Automated Hostinger Next.js Standalone Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Build & Package Standalone
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf standalone.tar.gz -C .next/standalone .

      - name: Deploy Standalone Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST || secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "standalone.tar.gz"
          target: "/home/u430632096/domains/hava-durumlari.tr/nodejs"

      - name: Restart PM2 Standalone Process via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd /home/u430632096/domains/hava-durumlari.tr/nodejs
            tar -xzf standalone.tar.gz
            rm standalone.tar.gz
            mkdir -p tmp && touch tmp/restart.txt
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            pm2 describe havapro-nextjs > /dev/null && pm2 restart havapro-nextjs || pm2 start server.js --name "havapro-nextjs"
