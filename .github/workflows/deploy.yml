name: Automated Hostinger Deployment

on:
  push:
    branches:
      - main # Triggers the deployment every time code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Hostinger Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Tedder Weather Engine Plugin
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
          ./wp-content/plugins/tedder-weather-engine/ \
          ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:public_html/wp-content/plugins/tedder-weather-engine/

      - name: Deploy GeneratePress Child Theme
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
          ./wp-content/themes/generatepress-child/ \
          ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:public_html/wp-content/themes/generatepress-child/
